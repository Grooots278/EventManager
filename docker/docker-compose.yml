services:

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile
    container_name: eventmanager-backend
    ports:
      - "5000:8080"
    depends_on:
      - postgres
      - rabbitmq
    environment:
      ASPNETCORE_ENVIRONMENT: Development

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
    container_name: eventmanager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  postgres:
    image: postgres:17
    container_name: eventmanager-postgres
    environment:
      POSTGRES_DB: eventmanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: eventmanager-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:4-management
    container_name: eventmanager-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: